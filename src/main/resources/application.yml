server:
  port: ${PORT:5002}
  servlet:
    context-path: /
spring:
  application:
    name: issuetracker-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:issuetracker;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  h2:
    console:
      enabled: ${SPRING_H2_CONSOLE_ENABLED:true}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_DDL_AUTO:update}
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
app:
  jwt:
    secret: ${JWT_SECRET:f12ab1843ce1067d57f0507f47b29921ab28b5e64fa60f51adbf0741d6c5498a9a9d4dd86775b3a7ee2dd47799f1f9d4fb1c5513d55f5b4c23b6751a1a76c28e}
    expiration-ms: ${JWT_EXPIRATION:86400000}
  uploads:
    dir: ${UPLOAD_DIR:./uploads}
  allowed-email-domains: "${ALLOWED_EMAIL_DOMAINS:}"   # e.g. "example.com,corp.io" — empty disables whitelist
